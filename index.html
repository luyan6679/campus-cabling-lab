const layout=[['classroom','classroom','classroom','classroom','service','duty'],['classroom','classroom','classroom','classroom','office','meeting'],['computer','computer','equipment','equipment','management','prep'],['office','office','office','office','meeting','archive'],['computer','computer','equipment','equipment','office','prep'],['studio','studio','seminar','seminar','office','meeting']];
const rooms=layout.flatMap((a,f)=>a.map((type,i)=>({id:String((f+1)*100+i+1),floor:f+1,type})));const specials={'104':'兼作公开课教室，增加1台独立有线联网的录播主机。','302':'增加1台独立联网的教师演示设备。','601':'本室有2台联网打印机，替代基础配置中的1台。'};

const defaultState=()=>({version:1,meta:{name:'',className:'',id:''},rows:Object.fromEntries(rooms.map(r=>[r.id,{d:'0',r:'0',v:'0',single:'0',double:'0',blank:'0',confirmed:false,reason:'',code:'A-'+r.id}])),summary:'',notes:'',install:{step:0,done:[],selected:[],height:0,gap:0,position:'请选择',tool:'',reserve:'0',strip:'0',untwist:'0',wires:Array(8).fill(''),voiceWires:Array(8).fill(''),port:'data',labelD:'',labelV:'',test:false,log:[],reflection:'',cords:[0,0,0]}});

function setMeta(k,v){state.meta[k]=v;save()}function identity(){return `<div class="row identity"><input aria-label="班级" placeholder="班级" value="${esc(state.meta.className)}" oninput="setMeta('className',this.value)"><input aria-label="学号" placeholder="学号" value="${esc(state.meta.id)}" oninput="setMeta('id',this.value)"><input aria-label="姓名" placeholder="姓名" value="${esc(state.meta.name)}" oninput="setMeta('name',this.value)"><small id="saveTime">自动保存在当前浏览器</small></div>`}

function renderDesign(){const main=$('main');if(section==='brief'){main.innerHTML=`<h1>六层教学实训楼配置任务</h1>${identity()}<div class="progress"><span style="width:${rooms.filter(completed).length/36*100}%"></span></div><div class="two"><section><h2>项目委托</h2><p>学校计划改造一栋六层教学实训楼，用于教学、计算机与设备实训、教师办公和项目研讨。请在装修前完成工作区信息点配置，并对401教师办公室的W01工位完成信息插座模拟安装。</p><p>每层6间功能用房，共36间。房间与需求为教学模拟资料。学生独立配置，使用网页统计核对并导出成果，上传学校平台。</p><h3>你要交付什么</h3><ol><li>房间编号、数据/语音/预留配置与理由。</li><li>房间、楼层、整楼点数统计。</li><li>面板、模块、跳线等材料概算。</li><li>401室信息插座模拟安装与测试记录。</li></ol><button class="primary" onclick="choose('rooms')">开始配置房间</button></section><section class="panel"><h2>统一设计条件</h2><ul class="req"><li>设备独立接入，不通过桌面交换机减少信息点。</li><li>备用数据端口计入数据总数，安装模块及标签，本期不配跳线。</li><li>语音独立端口，统一使用RJ45模块与语音适配跳线。</li><li>同位置端口可组成双口面板，不同位置不能为节省面板而合并。</li><li>每个面板配一个底盒；未使用的面板孔位配挡片。</li><li>除401外，本期数据端口统一配3m跳线；401需选择长度。</li><li>仅核算清单内工作区材料，不含固定水平电缆、配线架、交换机、主干、公共AP、监控、人工和税费。</li></ul><details><summary>编号与统计口径</summary><p>房间编号示例A-401；插座示例A-401-01；端口示例A-401-01-D、A-401-01-V。数据点=在用数据+预留数据；总信息点=数据点+语音点。面板按实体数统计。</p></details></section></div><h2>楼层功能安排</h2>${floorTable()}`}

tal().toFixed(2)+'元',28);heading('设计过程与实训体会');line(state.notes||'未填写');newPage();heading('401室W01模拟安装记录');g.drawImage(roomImage,70,y,660,360);g.drawImage(socketImage,750,y,420,360);y+=390;line(`安装位置：${state.install.position}；中心高度${state.install.height}mm；电源净距${state.install.gap}mm。`);line('材料工具：'+state.install.selected.join('、'));line('数据模块针脚1—8：'+state.install.wires.map(w=>w||'未填').join('、'));line('语音模块：场景预装，不重复进行端接操作，不计入学生端接成绩。');line('端口编号：'+state.install.labelD+' / '+state.install.labelV);line('模拟线序测试：'+(state.install.test?'1—8同序连通':'尚未通过'));line('基础线序测试不代表链路带宽、近端串扰等性能通过。',21);heading('操作过程');state.install.log.forEach(x=>line(x,21));heading('安装体会');line(state.install.reflection||'未填写');heading('成果完整性检查');const a=allIssues();if(a.length)a.forEach(x=>line(x,20));else line('必填项与数量检查通过；位置与施工可行性由教师审核。');pages.push(jpegBytes(c));return pdfBytes(pages)}function exportPDF(){try{toast('正在生成PDF，请稍候…');setTimeout(()=>{try{download(reportPDF(),'application/pdf','pdf')}catch(e){toast('PDF生成失败：'+e.message)}},80)}catch(e){toast(e.message)}}

const glossaryEntries={

const glossaryTerms=Object.keys(glossaryEntries);for(const [k,[title,body]]of Object.entries(glossaryEntries))knowledge[k]={title,body,source:'本实训器材与术语注解'};
let knowledgeTrail=[];
function knowledgeHTML(k){const a=knowledge[k];return `<div class="row" style="justify-content:space-between"><h2 id="knowledgeTitle">${esc(a.title)}</h2><button onclick="$('knowledgeDialog').close()">关闭</button></div><div class="knowledge-body"><p>${a.body.replaceAll('<em>','<strong class="keypoint">').replaceAll('</em>','</strong>')}</p><p class="source">依据：${esc(a.source)}</p><p class="muted">阅读后回到题目，结合本房间和施工条件作出选择。</p></div>`}
function openKnowledge(k,back=false){if(!knowledge[k])return;if(!back){if(!$('knowledgeDialog').open)knowledgeTrail=[];knowledgeTrail.push(k)}$('knowledgeDialog').innerHTML=knowledgeHTML(k)+(knowledgeTrail.length>1?'<button onclick="knowledgeTrail.pop();openKnowledge(knowledgeTrail[knowledgeTrail.length-1],true)">返回上一条知识</button>':'');annotateRoot($('knowledgeDialog'),true);if(!$('knowledgeDialog').open)$('knowledgeDialog').showModal()}
// Full phrases are matched first; ambiguous cross-word strings are protected explicitly.
const protectedPhrases={'终端接口':['终端','接口'],'终端接口核对':['终端','接口','核对']};
function termSegments(value){const keys=[...Object.keys(knowledge),...Object.keys(protectedPhrases)].sort((a,b)=>b.length-a.length),rx=new RegExp(keys.join('|'),'g'),out=[];let end=0;for(const m of value.matchAll(rx)){if(m.index>end)out.push({text:value.slice(end,m.index)});if(protectedPhrases[m[0]])for(const part of protectedPhrases[m[0]])out.push({text:part,key:knowledge[part]?part:null});else out.push({text:m[0],key:m[0]});end=m.index+m[0].length}if(end<value.length)out.push({text:value.slice(end)});return out}
function annotateRoot(root,glossaryOnly=false){if(!root||!document.createTreeWalker)return;const walker=document.createTreeWalker(root,4);let node,nodes=[];while(node=walker.nextNode())if(!node.parentElement.closest('button,input,select,textarea,canvas,script,h1,h2,h3,table,.source,.muted,.log'))nodes.push(node);for(const text of nodes){const segments=termSegments(text.nodeValue);if(!segments.some(x=>x.key&&(!glossaryOnly||glossaryTerms.includes(x.key))))continue;const frag=document.createDocumentFragment();for(const seg of segments){if(!seg.key||(glossaryOnly&&!glossaryTerms.includes(seg.key))){frag.append(document.createTextNode(seg.text));continue}const b=document.createElement('button');b.className='knowledge';b.type='button';b.textContent=seg.text;b.title='点击查看：'+seg.key;b.setAttribute('aria-label','查看'+seg.key+'注解');b.onclick=()=>openKnowledge(seg.key);frag.append(b)}text.replaceWith(frag)}}
function annotate(){const root=$('main');if(root?.querySelectorAll)for(const label of root.querySelectorAll('label')){if(label.closest('.choiceblock,.toolbox')||label.querySelector(':scope > .label-text'))continue;const control=label.querySelector(':scope > input,:scope > select,:scope > textarea');if(!control)continue;const caption=document.createElement('span');caption.className='label-text';for(const child of [...label.childNodes]){if(child===control)break;caption.append(child)}label.insertBefore(caption,control)}annotateRoot(root)}

function ensureDecisions(){state.decisions=state.decisions||{};state.answers=state.answers||{};state.attempts=state.attempts||[];for(const room of rooms)state.decisions[room.id]=state.decisions[room.id]||{placement:'',priority:'',adapter:'',reason:''}}
ensureDecisions();
function decisionSet(k,v){state.decisions[roomId][k]=v;save()}
function selectField(label,key,options){const value=state.decisions[roomId][key];return `<label>${label}<select onchange="decisionSet('${key}',this.value)"><option value="">请选择并结合房间条件判断</option>${options.map(v=>`<option ${value===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}
function decisionPanel(){return `<section class="decisions"><h3>本室设计决策</h3><p>下列选择允许不同方案。说明使用位置、保护方式和取舍依据，教师结合说明审核。</p>${selectField('信息插座安装位置','placement',['墙面为主','家具或工作台配套','地面盒为主','墙面与地面组合'])}${selectField('当前方案主要关注','priority',['便于维护与调整','扩展能力','材料费用与合理配置'])}${selectField('终端接口核对','adapter',['连接器匹配，直接连接','部分终端需专用适配跳线'])}<label>选择依据与必要保护措施<textarea onchange="decisionSet('reason',this.value)" placeholder="例如中部实训台如何接入、地面盒需要什么保护、额外预留给哪些设备">${esc(state.decisions[roomId].reason)}</textarea></label></section>`}
function challengeHTML(list){return list.map(q=>`<fieldset class="choiceblock"><legend>${esc(q.title)}</legend>${q.opts.map((o,i)=>`<label><input type="radio" name="q-${q.id}" value="${i}" ${state.answers[q.id]===i?'checked':''} onchange="answerQuestion('${q.id}',${i})"><span class="option-text">${esc(o)}</span></label>`).join('')}<div id="feedback-${q.id}" aria-live="polite"></div></fieldset>`).join('')}
function answerQuestion(id,i){ensureDecisions();state.answers[id]=i;state.install.test=false;if(page==='install'){state.install.done=state.install.done.filter(x=>x<step)}save()}
function checkChallenges(list){const wrong=list.filter(q=>state.answers[q.id]!==q.answer);for(const q of list){const el=$('feedback-'+q.id);if(el)el.innerHTML=`<div class="notice ${state.answers[q.id]===q.answer?'':'error'}">${state.answers[q.id]===q.answer?'判断通过。':state.answers[q.id]===undefined?'请先选择。':'请重新判断。'} ${state.answers[q.id]===q.answer?esc(q.why):'可点击题目中的灰底关键词查看相关知识。'}</div>`}state.attempts.push({time:new Date().toISOString(),questions:list.map(q=>q.id),answers:Object.fromEntries(list.map(q=>[q.id,state.answers[q.id]??null])),passed:wrong.length===0});save();return wrong}
const originalRenderDesign=renderDesign;renderDesign=function(){ensureDecisions();originalRenderDesign();if(section==='brief'){$('main').insertAdjacentHTML('afterbegin','<p class="muted">灰底关键词可点击查看知识点，重点内容以加粗红色下划线标示。</p>');$('main').insertAdjacentHTML('beforeend','<section class="panel"><h2>先作出你的项目判断</h2>'+challengeHTML(challenges.filter(q=>q.step===null))+'<button onclick="checkChallenges(challenges.filter(q=>q.step===null))">检查判断</button></section>')}if(section==='rooms'){$('main').querySelector('.two section:last-child').insertAdjacentHTML('beforeend',decisionPanel())}annotate()};
const originalRenderInstall=renderInstall;renderInstall=function(){ensureDecisions();originalRenderInstall();const list=challenges.filter(q=>q.step===step),right=$('main').querySelector('.two section:last-child');if(right&&list.length)right.insertAdjacentHTML('beforeend','<section class="decisions"><h3>现场判断</h3>'+challengeHTML(list)+'</section>');annotate()};
const originalPerformStep=performStep;performStep=function(){const wrong=checkChallenges(challenges.filter(q=>q.step===step));if(wrong.length){toast('请完成现场判断后再执行本步骤。');return}originalPerformStep()};const originalRunTest=runTest;runTest=function(){if(checkChallenges(challenges.filter(q=>q.step===6)).length)return toast('请先判断本次测试能够证明什么。');originalRunTest()};
const originalIssues=issues;issues=function(room){const out=originalIssues(room),d=state.decisions?.[room.id];if(!d||!d.placement||!d.priority||!d.adapter||!d.reason.trim())out.push('完成本室设计决策与依据');if(d&&/地面/.test(d.placement)&&!/防水|抗压|防尘/.test(d.reason))out.push('地面方案需说明防水、抗压或防尘保护');return out};const originalAllIssues=allIssues;allIssues=function(){ensureDecisions();return [...originalAllIssues(),...challenges.filter(q=>state.answers[q.id]!==q.answer).map(q=>'现场判断未完成：'+q.title)]};
function learningRecord(){return ['自主设计决策',...rooms.map(r=>{const a=state.decisions[r.id];return r.id+'：'+a.placement+'；主要关注'+a.priority+'；'+a.adapter+'；理由：'+a.reason}), '情境判断',...challenges.map(q=>q.title+'\n选择：'+(q.opts[state.answers[q.id]]||'未作答')), '判断检查记录',...state.attempts.map(a=>a.time+' '+a.questions.join('、')+' '+(a.passed?'通过':'需修改')+'；选择记录：'+JSON.stringify(a.answers))].join('\n')}
const originalReportPDF=reportPDF;reportPDF=function(){ensureDecisions();const previous=state.notes;state.notes=previous+'\n\n'+learningRecord();try{return originalReportPDF()}finally{state.notes=previous}};const originalWorkbook=workbook;workbook=function(){ensureDecisions();const previous=state.notes;state.notes=previous+'\n\n'+learningRecord();try{return originalWorkbook()}finally{state.notes=previous}};

state.projectJudgmentPassed=state.projectJudgmentPassed===true;
state.activity=Array.isArray(state.activity)?state.activity:[];
state.activityStarted=state.activityStarted||new Date().toISOString();
for(const rr of rooms){const r=state.rows[rr.id];for(const k of ['d','r','v','single','double','blank'])if(r[k]==='')r[k]='0';if(r.confirmed!==true)r.confirmed=false}

const v13Choose=choose;choose=function(s){if(s!=='brief'&&!requireInitialJudgment())return;audit('进入设计阶段',{section:s});v13Choose(s)};

const v13Check=checkChallenges;checkChallenges=function(list){const wrong=v13Check(list),initial=list.length===2&&list.every(q=>q.step===null);audit('检查情境判断',{questions:list.map(q=>q.id),answers:Object.fromEntries(list.map(q=>[q.id,state.answers[q.id]??null])),passed:wrong.length===0});if(initial&&!wrong.length){const first=!state.projectJudgmentPassed;state.projectJudgmentPassed=true;audit(first?'首次项目判断通过并解锁':'再次检查项目判断通过');toast('项目判断已通过，后续阶段已解锁。');const area=$('main');if(area&&!$('beginAfterJudgment'))area.insertAdjacentHTML('beforeend','<button id="beginAfterJudgment" class="primary" onclick="choose(\'rooms\')">进入房间配置</button>')}return wrong};
const v13UpdateRow=updateRow;updateRow=function(k,v){const before=state.rows[roomId][k];v13UpdateRow(k,v);audit('修改房间配置',{room:roomId,field:k,before,after:state.rows[roomId][k]})};

const v13InstallValue=installValue;installValue=function(k,v){const before=state.install[k];v13InstallValue(k,v);audit('修改安装参数',{step:steps[step],field:k,before,after:v})};

const v13Copy=copyType;copyType=function(){const from=roomId;v13Copy();audit('复制同类房间配置',{from})};
